<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Postulaciones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="loginScreen" class="login-screen">
      <div class="login-card">
        <p class="eyebrow">Bienvenido</p>
        <h2>Ingresá tu nombre</h2>

        <form id="loginForm" novalidate>
          <div class="field-group">
            <label for="nombreUsuario">Nombre</label>
            <input id="nombreUsuario" name="nombreUsuario" type="text" placeholder="Ej: Ana" required />
          </div>

          <button type="submit" class="primary-btn">Entrar</button>
        </form>
      </div>
    </div>

    <div id="appShell" class="app-shell hidden">
      <header class="topbar">
        <div>
          <p class="eyebrow">Seguimiento laboral</p>
          <h1>Postulaciones</h1>
        </div>

        <div class="topbar-actions">
          <span id="userBadge" class="user-badge" aria-live="polite"></span>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar tema">
            🌙 Modo oscuro
          </button>
          <button id="logoutBtn" class="logout-btn hidden" type="button">Cerrar sesión</button>
        </div>
      </header>

      <main class="main-content">
        <section class="card form-card">
          <h2>Agregar postulación</h2>

          <form id="formPostulacion" novalidate>
            <div class="field-group">
              <label for="empresa">Empresa</label>
              <input id="empresa" name="empresa" type="text" placeholder="Ej: Mercado Libre" required />
            </div>

            <div class="field-group">
              <label for="rol">Rol</label>
              <input id="rol" name="rol" type="text" placeholder="Ej: Frontend Developer" required />
            </div>

            <div class="field-group">
              <label for="fecha">Fecha</label>
              <input id="fecha" name="fecha" type="date" required />
            </div>

            <div class="field-group">
              <label for="estado">Estado</label>
              <select id="estado" name="estado" required>
                <option value="Enviado">Enviado</option>
                <option value="En proceso">En proceso</option>
                <option value="Rechazado">Rechazado</option>
                <option value="Oferta">Oferta</option>
              </select>
            </div>

            <button type="submit" class="primary-btn">Guardar postulación</button>
          </form>
        </section>

        <section class="card list-card">
          <div class="summary-section" id="resumenEstados" aria-live="polite"></div>

          <div class="filter-bar">
            <div class="filter-field">
              <label for="estadoFiltro">Filtrar por estado</label>
              <select id="estadoFiltro" name="estadoFiltro">
                <option value="Todos">Todos</option>
                <option value="Enviado">Enviado</option>
                <option value="En proceso">En proceso</option>
                <option value="Rechazado">Rechazado</option>
                <option value="Oferta">Oferta</option>
              </select>
            </div>
          </div>

          <div class="list-header">
            <h2>Listado</h2>
            <span id="totalPostulaciones" class="total-badge">0</span>
          </div>

          <div id="postulacionesList" class="postulaciones-list" aria-live="polite"></div>

          <div id="emptyState" class="empty-state">
            <p>No hay postulaciones todavía.</p>
            <span>Agregá tu primera aplicación para comenzar.</span>
          </div>
        </section>
      </main>
    </div>

    <div id="confirmModal" class="confirm-modal hidden" aria-hidden="true">
      <div class="confirm-modal__content" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
        <p class="confirm-modal__eyebrow">Confirmar eliminación</p>
        <h3 id="confirmTitle">Eliminar postulación</h3>
        <p id="confirmText" class="confirm-modal__text">¿Seguro que quieres eliminar esta postulación?</p>
        <div class="confirm-modal__actions">
          <button id="cancelDelete" type="button" class="secondary-btn">Cancelar</button>
          <button id="confirmDelete" type="button" class="danger-btn">Eliminar</button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
